name: pls-deployable-mvp

services:
  postgres:
    image: postgres:16-alpine
    container_name: pls-postgres-app
    restart: unless-stopped
    environment:
      POSTGRES_DB: pls_platform
      POSTGRES_USER: pls_app
      POSTGRES_PASSWORD: pls_app_password
    volumes:
      - pls_postgres_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pls_app -d pls_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pls-backend-app
    restart: unless-stopped
    environment:
      PORT: "3100"
      PERSISTENCE_ADAPTER: postgres
      DATABASE_URL: postgres://pls_app:pls_app_password@postgres:5432/pls_platform
      DATABASE_SSL_MODE: disable
      DB_MIGRATIONS_ENABLED: "true"
      DEMO_SEED_ENABLED: "true"
      EXTERNAL_API_SHARED_SECRET: change-me-local-external-secret
      VITE_ENABLE_LOCAL_DEMO_FALLBACK: "false"
      VITE_ENABLE_GUIDED_DEMO: "false"
    ports:
      - "3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pls-frontend-app
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:3100
      VITE_ENABLE_LOCAL_DEMO_FALLBACK: "false"
      VITE_ENABLE_GUIDED_DEMO: "false"
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10

volumes:
  pls_postgres_app_data:
