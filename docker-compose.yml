services:
  postgres:
    image: postgres:16-alpine
    container_name: pls-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pls_platform
      POSTGRES_USER: pls_app
      POSTGRES_PASSWORD: pls_app_password
    ports:
      - "5432:5432"
    volumes:
      - pls_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pls_app -d pls_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pls_postgres_data:
