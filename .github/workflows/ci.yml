name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Validate OpenAPI contract
      run: npm run openapi:validate

    - name: Validate database migrations
      run: npm run db:migrate -- --dry-run

    - name: Validate demo seed data
      run: npm run db:seed -- --dry-run

    - name: Validate Docker Compose model
      run: docker compose -f docker-compose.app.yml config

    - name: Build project
      run: npm run build

    - name: Build frontend
      run: npm run frontend:build

    - name: Run tests
      run: npm test
