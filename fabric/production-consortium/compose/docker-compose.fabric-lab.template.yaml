# PBI-438 production-like local Fabric lab Compose template.
#
# This file is a runnable scaffold for a single-host Dockerized consortium lab.
# It is not live evidence by itself. Keep generated crypto, ledgers, wallets,
# channel artifacts, logs, and evidence under FABRIC_PRODUCTION_LAB_WORKSPACE,
# not inside this repository.
#
# Required before use:
#   $env:FABRIC_PRODUCTION_LAB_WORKSPACE = "C:\fabric-labs\eprocure-consortium"
#   Set CA bootstrap IDs/secrets as environment variables or in a local
#   untracked .env file outside the repository.

name: pbi438-production-fabric-lab

networks:
  fabric_lab:
    name: pbi438-fabric-lab

services:
  ca.orderer:
    image: hyperledger/fabric-ca:1.5
    container_name: pbi438-ca-orderer
    command: sh -c 'fabric-ca-server start -b "$${ORDERER_CA_BOOTSTRAP_ID}:$${ORDERER_CA_BOOTSTRAP_SECRET}" -d'
    environment:
      FABRIC_CA_SERVER_CA_NAME: ca-orderer
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_PORT: "6054"
      ORDERER_CA_BOOTSTRAP_ID: ${ORDERER_CA_BOOTSTRAP_ID:?set outside repository}
      ORDERER_CA_BOOTSTRAP_SECRET: ${ORDERER_CA_BOOTSTRAP_SECRET:?set outside repository}
    volumes:
      - ${FABRIC_PRODUCTION_LAB_WORKSPACE:?set external workspace}/crypto/fabric-ca/orderer:/etc/hyperledger/fabric-ca-server
    ports:
      - "6054:6054"
    networks:
      fabric_lab:
        aliases:
          - ca.orderer.example.test

  ca.platform:
    image: hyperledger/fabric-ca:1.5
    container_name: pbi438-ca-platform
    command: sh -c 'fabric-ca-server start -b "$${PLATFORM_CA_BOOTSTRAP_ID}:$${PLATFORM_CA_BOOTSTRAP_SECRET}" -d'
    environment:
      FABRIC_CA_SERVER_CA_NAME: ca-platform
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_PORT: "7054"
      PLATFORM_CA_BOOTSTRAP_ID: ${PLATFORM_CA_BOOTSTRAP_ID:?set outside repository}
